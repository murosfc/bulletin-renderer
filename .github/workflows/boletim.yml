name: Atualizar Boletim

on:
  # Disparado pela Cloud Function do Firebase (projeto ipmacae) quando um novo
  # boletim é enviado. Payload esperado: { "pdf_url": "<url de download do PDF>" }
  repository_dispatch:
    types: [novo-boletim]
  # Disparo manual para testes: Actions -> Atualizar Boletim -> Run workflow
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "URL de download do PDF do boletim"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: boletim
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # Cabe a espera pelo reset do limite de 5h da assinatura Claude (ver o
    # passo "Atualizar landing page com Claude Code").
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Baixar novo boletim.pdf
        env:
          PDF_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pdf_url || github.event.client_payload.pdf_url }}
        run: |
          if [ -z "$PDF_URL" ]; then
            echo "::error::Nenhuma pdf_url informada no payload"; exit 1
          fi
          curl -fsSL "$PDF_URL" -o boletim.pdf
          head -c 5 boletim.pdf | grep -q "%PDF-" || { echo "::error::Arquivo baixado não é um PDF válido"; exit 1; }
          ls -la boletim.pdf

      - name: Preparar dependências (pypdf, pillow, playwright)
        run: |
          pip install --quiet pypdf pillow playwright
          python -m playwright install --with-deps chromium

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # O PDF já foi baixado, então dá para esperar: se a assinatura Claude
      # bater o limite de uso (429/529), tenta de novo a cada 15 min por até
      # ~5h, o tempo do reset da janela de 5h. Qualquer outro erro falha na hora.
      - name: Atualizar landing page com Claude Code
        id: claude
        env:
          # Token da assinatura Claude Pro/Max, gerado com `claude setup-token`.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RETRY_WINDOW_MINUTES: 290
          RETRY_WAIT_SECONDS: 900
          PROMPT: |
            Um novo boletim.pdf acabou de ser colocado na raiz do repositório.
            Siga rigorosamente as instruções de UPDATE.md e CLAUDE.md para
            atualizar a landing page:

            1. Rode `python scripts/generate_boletim_json.py` (pypdf e pillow
               já estão instalados) para regenerar data/boletim.json e as
               imagens em assets/boletim-images/.
            2. Leia o texto extraído (rawPages do JSON) e corrija manualmente
               em data/boletim.json qualquer campo que a extração automática
               tenha errado (título, referência, autor, corpo, versículo,
               agenda, aniversariantes).
            3. Atualize index.html com o conteúdo da nova edição, preservando
               o design, as classes CSS e a estrutura de tags. Atenção a
               avisos/cancelamentos na agenda (classe `cancelled`), à galeria
               (uma tag por imagem realmente extraída) e ao número da edição
               no <head>, no cabeçalho e no rodapé.
            4. Valide: suba `python -m http.server 5500` em segundo plano e
               use Playwright com Chromium (já instalado) para conferir que
               todos os assets carregam, que o botão de copiar PIX funciona e
               que o lightbox abre e fecha. Salve capturas de tela (desktop
               completo, galeria e mobile 390px) na pasta ./screenshots/.
            5. Escreva um resumo do que mudou em ./screenshots/RESUMO.md.

            NÃO faça git commit nem git push — o workflow cuida disso.
            Se o PDF estiver ilegível ou radicalmente diferente do padrão,
            descreva o problema em ./screenshots/RESUMO.md e não altere o
            index.html.
        run: |
          deadline=$(( $(date +%s) + RETRY_WINDOW_MINUTES * 60 ))
          attempt=1
          while true; do
            echo "::group::Tentativa $attempt"
            set +e
            claude -p "$PROMPT" \
              --allowedTools "Bash,Edit,Write,Read,Glob,Grep" \
              --max-turns 100 \
              --output-format json > claude-result.json
            code=$?
            set -e
            jq 'del(.modelUsage)' claude-result.json || cat claude-result.json
            echo "::endgroup::"

            if [ "$code" -eq 0 ] && [ "$(jq -r '.is_error' claude-result.json)" = "false" ]; then
              echo "Claude concluiu na tentativa $attempt."
              exit 0
            fi

            if ! grep -qE 'usage_limit_reached|rate_limit_error|overloaded_error|"api_error_status": *(429|529)' claude-result.json; then
              echo "::error::Claude falhou: $(jq -r '.result // "sem detalhes"' claude-result.json)"
              echo "reason=erro do agente durante a atualização" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            if [ $(( $(date +%s) + RETRY_WAIT_SECONDS )) -gt "$deadline" ]; then
              echo "::error::Limite de uso do Claude não liberou após $attempt tentativas."
              echo "reason=limite de uso do Claude não liberou após $attempt tentativas" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "::warning::Limite de uso do Claude ($(jq -r '.result' claude-result.json)). Nova tentativa em $(( RETRY_WAIT_SECONDS / 60 )) min."
            sleep "$RETRY_WAIT_SECONDS"
            attempt=$(( attempt + 1 ))
          done

      - name: Publicar capturas de tela e resumo (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-boletim
          path: screenshots/
          if-no-files-found: ignore

      - name: Validar render antes do commit
        run: python scripts/validate_boletim.py

      - name: Commit e push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm -rf screenshots claude-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          ISSUE=$(python -c "import json; print(json.load(open('data/boletim.json'))['meta'].get('issue',''))" 2>/dev/null || echo "")
          git commit -m "chore: atualiza boletim${ISSUE:+ para edição Nº $ISSUE} (automático)"

      - name: Push com GitHub Actions Bot
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: main

      - name: Abrir issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 Falha na atualização automática do boletim"
          BODY="O workflow **Atualizar Boletim** falhou em $(date -u '+%d/%m/%Y %H:%M UTC').

          **Run com os logs:** $RUN_URL

          Causas mais prováveis:
          - Limite de uso da assinatura Claude esgotado mesmo após as novas tentativas
          - \`CLAUDE_CODE_OAUTH_TOKEN\` revogado ou expirado (gere outro com \`claude setup-token\`)
          - PDF inacessível na URL informada
          - Erro do agente durante a atualização (ver logs)

          Enquanto isso, o site continua no ar com a última edição publicada."
          gh label create automacao --color D93F0B --description "Falhas da automação do boletim" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label automacao --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label automacao --body "$BODY"
          fi

      # Push para os superUsers do app IP Macaé, via Cloud Function do projeto
      # ipmacae-app. Sem segredo: a function valida o token OIDC do GitHub
      # (permissão id-token: write) e confere que veio deste workflow.
      - name: Avisar superUsers do app (push)
        if: failure()
        continue-on-error: true
        env:
          ALERT_URL: https://us-central1-ipmacae-app.cloudfunctions.net/notifyBulletinRenderFailure
          REASON: ${{ steps.claude.outputs.reason }}
        run: |
          OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ipmacae-bulletin-render-alert" | jq -r '.value')
          curl --fail-with-body -sS -X POST "$ALERT_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg reason "$REASON" '{reason: $reason}')"
